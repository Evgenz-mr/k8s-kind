apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
data:
  APP_ENV: development
  LOG_LEVEL: debug
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command: ['sh', '-c', 'env | grep -E "APP_ENV|LOG_LEVEL"; sleep 3600']
      envFrom:
        - configMapRef:
            name: demo-config

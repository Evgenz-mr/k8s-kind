apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: database
spec:
  selector: {app: mongodb}
  ports:
    - {port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - {containerPort: 27017}
          readinessProbe:
            exec: {command: ["mongosh","--quiet","--eval","db.adminCommand('ping').ok"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
      volumes:
        - name: data
          emptyDir: {}

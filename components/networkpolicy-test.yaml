apiVersion: v1
kind: Namespace
metadata:
  name: network-test
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: network-test
  labels:
    app: server
spec:
  containers:
    - name: nginx
      image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: network-test
spec:
  selector:
    app: server
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-allow-client
  namespace: network-test
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuber-console
  labels:
    app.kubernetes.io/name: kuber-console
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuber-console-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuber-console-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuber-console-token-review
subjects:
  - kind: ServiceAccount
    name: kuber-console
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuber-console-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.rbac.clusterAdminGroup | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuber-console-namespace-admins
  namespace: {{ .Values.rbac.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.rbac.namespaceAdminGroup | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kuber-console-branding
data:
  kuber-logo.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kuber">
      <rect width="64" height="64" rx="14" fill="#151b2b"/>
      <path d="M16 13h9v17l16-17h12L35 31l19 20H42L28 36l-3 3v12h-9z" fill="#66d9c8"/>
      <circle cx="49" cy="13" r="4" fill="#f0abfc"/>
    </svg>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuber-console
  labels:
    app.kubernetes.io/name: kuber-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuber-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuber-console
    spec:
      serviceAccountName: kuber-console
      automountServiceAccountToken: true
      hostAliases:
        - ip: {{ required "auth.issuerHostAlias must be set by the OIDC bootstrap" .Values.auth.issuerHostAlias | quote }}
          hostnames:
            - keycloak.kuber.local
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /opt/bridge/bin/bridge
          args:
            - --listen=http://0.0.0.0:9000
            - --k8s-mode=in-cluster
            - --branding=okd
            - --custom-product-name=Kuber
            - --custom-logo-files=Light=/var/run/kuber-branding/kuber-logo.svg,Dark=/var/run/kuber-branding/kuber-logo.svg
            - --custom-favicon-files=Light=/var/run/kuber-branding/kuber-logo.svg,Dark=/var/run/kuber-branding/kuber-logo.svg
            - --user-auth=oidc
            - --base-address={{ .Values.auth.baseAddress }}
            - --user-auth-oidc-issuer-url={{ .Values.auth.issuerUrl }}
            - --user-auth-oidc-client-id={{ .Values.auth.clientId }}
            - --user-auth-oidc-client-secret-file=/var/run/kuber-oidc/client-secret
            - --user-auth-oidc-ca-file=/var/run/kuber-oidc-ca/ca.crt
            - --cookie-encryption-key-file=/var/run/kuber-session/cookie-encryption-key
            - --cookie-authentication-key-file=/var/run/kuber-session/cookie-authentication-key
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: branding
              mountPath: /var/run/kuber-branding
              readOnly: true
            - name: oidc-client-secret
              mountPath: /var/run/kuber-oidc
              readOnly: true
            - name: oidc-ca
              mountPath: /var/run/kuber-oidc-ca
              readOnly: true
            - name: session-keys
              mountPath: /var/run/kuber-session
              readOnly: true
      volumes:
        - name: branding
          configMap:
            name: kuber-console-branding
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.auth.secretName }}
            items:
              - key: {{ .Values.auth.secretKey }}
                path: client-secret
        - name: oidc-ca
          secret:
            secretName: {{ .Values.auth.caSecretName }}
            items:
              - key: {{ .Values.auth.caSecretKey }}
                path: ca.crt
        - name: session-keys
          secret:
            secretName: kuber-console-session
            items:
              - key: cookie-encryption-key
                path: cookie-encryption-key
              - key: cookie-authentication-key
                path: cookie-authentication-key
---
apiVersion: v1
kind: Service
metadata:
  name: kuber-console
  labels:
    app.kubernetes.io/name: kuber-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kuber-console
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

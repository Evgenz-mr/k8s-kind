apiVersion: v1
kind: Namespace
metadata:
  name: kuber-system
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: kuber-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 9443
      targetPort: 8443
      protocol: TCP

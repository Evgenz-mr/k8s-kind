apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-creative-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Evgenz-mr/ai-creative-backend.git
    targetRevision: main
    path: helm
    helm:
      releaseName: ai-creative-backend
      values: |
        image:
          repository: ghcr.io/evgenz-mr/ai-creative-backend
          tag: latest
          pullPolicy: Always
        ingress:
          enabled: true
          className: nginx
          host: ai-creative.local
          path: /api
        config:
          corsOrigins: "http://ai-creative.local"
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-creative
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
